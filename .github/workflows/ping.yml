name: Keep Server Awake

on:
  schedule:
    # Runs every 14 minutes (Render sleeps after 15 mins of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the server
        run: |
          echo "Pinging server to keep it awake..."
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" https://currentdatetimepy.onrender.com/
